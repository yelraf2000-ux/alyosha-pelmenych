# Render Blueprint: the whole shop as one web service plus a Postgres, on Render's smallest paid
# plans (about $13.25 a month in all; prices on https://render.com/pricing):
#   - web service 0.5c-512mb ("Starter"), $7: always on, so the Telegram bot answers at once
#   - a 1 GB disk for product photos and videos, $0.25: they survive restarts and deploys
#   - Postgres 0.1c-256mb ("Basic"), $6, with the 1 GB of storage that is included: never expires
#
# Render applies this file on every push to the main branch (the Blueprint's Auto Sync), so a
# change of plan here changes the bill. Sizes can be raised later but never lowered.
#
# To try the shop for free instead, set both plans to `free` and remove `disk` and `diskSizeGB`.
# Then the service sleeps after 15 minutes without visitors, uploaded photos disappear on every
# restart, and the database is deleted about six weeks after it is created.
#
# The other way to run the shop is docker-compose.yml on a VPS (README, "Deploying to a server").

services:
  - type: web
    name: alyosha-pelmenych
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alyosha-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Asked for once, when the Blueprint is created. Make the value with:
      #   npm run admin:password -w @alyosha/api -- --print
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Optional: leave empty and notifications are only written to the service log.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Render's proxy is the only thing in front of the service, and it sets X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"

databases:
  - name: alyosha-db
    plan: 0.1c-256mb
    # Without this line a paid database gets 15 GB, and every GB past the first is billed.
    diskSizeGB: 1
    region: frankfurt
    databaseName: alyosha
    user: alyosha
    postgresMajorVersion: "17"

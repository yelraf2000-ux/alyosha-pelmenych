# Production stack for one small VPS (SPEC §4, §10):
#   web     Caddy: HTTPS certificates, the static storefront, reverse proxy to the API
#   api     Fastify
#   db      PostgreSQL
#   backup  daily database dump and photo archive into ./backups
#
# Settings come from the .env file next to this one; see .env.production.example and README.md.

x-logging: &logging
  driver: json-file
  options:
    # Without a cap, container logs slowly fill a small disk.
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alyosha
      POSTGRES_USER: alyosha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alyosha -d alyosha"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://alyosha:${POSTGRES_PASSWORD}@db:5432/alyosha
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Not marked as required here, because this image is also what creates the hash
      # (README, "Admin password"). The API itself refuses to start without it.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Caddy is the only thing that talks to the API, and it sets X-Forwarded-For.
      TRUST_PROXY: "1"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates. Losing this volume means asking Let's Encrypt for new ones.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: alyosha
      PGDATABASE: alyosha
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads:ro
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    # Runs one backup every night at 23:00 UTC (03:00 in Yerevan).
    entrypoint: ["sh", "/usr/local/bin/backup.sh", "--daily"]
    logging: *logging

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
